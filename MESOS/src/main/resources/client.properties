# Fast Start Configuration
# Set to true to skip the command line prompts and use the settings below automatically
client.fast_start=true

# Client Network Configuration
server.host=localhost
server.port.socket=12345
server.port.rmi=1234
server.rmi.name=MESOS_RMI

# Connection Strategy (SOCKET or RMI)
connection.protocol=SOCKET

# UI Mode (GUI or TUI)
client.ui=GUI
